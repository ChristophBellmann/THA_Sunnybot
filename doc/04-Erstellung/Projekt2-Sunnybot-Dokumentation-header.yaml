abstract: |
  | Useless Machine - Ein Gerät was sich selbst wieder ausschaltet, nachdem es eingeschaltet wird. Dieses Gerät ist ein Roboter, welcher anfängt zur nächsten Lichtquelle zu fahren, wenn ihm eine Lichtquelle über ihm weggenommen wird. Es handelt sich um einen selbstfahrenden Roboter, welcher sich in Abhängigkeit von seiner Umgebung bewegt.
